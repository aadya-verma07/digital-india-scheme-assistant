# Render Blueprint: creates the web app + a free PostgreSQL database in one go.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: digital-india-scheme-assistant
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: scheme-assistant-db
          property: connectionString
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false

databases:
  - name: scheme-assistant-db
    plan: free
    databaseName: scheme_assistant
    user: scheme_user
